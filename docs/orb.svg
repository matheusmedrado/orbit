<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="160" height="176" role="img" aria-label="Orbit">
  <defs>
    <radialGradient id="light" cx="0.33" cy="0.29" r="0.73">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCD1DE"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.47" cy="0.45" r="0.52">
      <stop offset="0.62" stop-color="#7E8394" stop-opacity="0"/>
      <stop offset="1" stop-color="#7E8394" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .float { animation: float 5s ease-in-out infinite; }
    .shadow { animation: shadow 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .gaze { animation: gaze 10s ease-in-out infinite; }
    .eye { animation: blink 4.6s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.84); opacity: 0.55; } }
    @keyframes gaze {
      0%, 18% { transform: translate(0, 0); }
      26%, 44% { transform: translate(-4px, -1px); }
      52%, 70% { transform: translate(4px, -1px); }
      78%, 100% { transform: translate(0, 0); }
    }
    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(1); animation-timing-function: ease-in; }
      93% { transform: scaleY(0.08); animation-timing-function: ease-out; }
      96% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <ellipse class="shadow" cx="60" cy="124" rx="30" ry="5" fill="url(#shadow)"/>
  <g class="float">
    <g transform="translate(10 8)">
      <circle cx="50" cy="50" r="48" fill="url(#light)"/>
      <circle cx="50" cy="50" r="48" fill="url(#rim)"/>
      <circle cx="50" cy="50" r="47.6" fill="none" stroke="#000" stroke-opacity="0.14" stroke-width="0.8"/>
      <g class="gaze" fill="#1C1E2D">
        <rect class="eye" x="27.25" y="40" width="13.5" height="32" rx="6.75"/>
        <rect class="eye" x="59.25" y="40" width="13.5" height="32" rx="6.75"/>
      </g>
    </g>
  </g>
</svg>
